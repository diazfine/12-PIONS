    <script>
      (function() {
        try {
          // React Fast Refresh preamble definition so @vitejs/plugin-react never throws in dev/SSR
          window.$RefreshReg$ = function() {};
          window.$RefreshSig$ = function() { return function(type) { return type; }; };
          window.__vite_plugin_react_preamble_installed__ = true;

          // 1. Mock Vite HMR WebSocket so it never fails or throws 'WebSocket closed without opened' in preview iframe
          var RealWebSocket = window.WebSocket;
          if (typeof RealWebSocket === 'function' && !window.__VITE_HMR_WS_MOCKED__) {
            window.__VITE_HMR_WS_MOCKED__ = true;
            function MockHmrSocket(url, protocols) {
              var urlStr = String(url || '');
              if (urlStr.indexOf('/ws') !== -1 && protocols !== 'vite-hmr' && protocols !== 'vite-ping') {
                return new RealWebSocket(url, protocols);
              }
              var target = new EventTarget();
              var dummy = {
                url: urlStr,
                readyState: 1, // OPEN
                bufferedAmount: 0,
                extensions: '',
                protocol: typeof protocols === 'string' ? protocols : 'vite-hmr',
                binaryType: 'blob',
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                send: function() {},
                close: function() {},
                addEventListener: function(type, listener, options) {
                  target.addEventListener(type, listener, options);
                },
                removeEventListener: function(type, listener, options) {
                  target.removeEventListener(type, listener, options);
                },
                dispatchEvent: function(event) {
                  return target.dispatchEvent(event);
                },
                onopen: null,
                onmessage: null,
                onerror: null,
                onclose: null,
              };
              setTimeout(function() {
                var ev = new Event('open');
                if (typeof dummy.onopen === 'function') dummy.onopen(ev);
                dummy.dispatchEvent(ev);
              }, 0);
              return dummy;
            }
            MockHmrSocket.prototype = RealWebSocket.prototype;
            MockHmrSocket.CONNECTING = RealWebSocket.CONNECTING;
            MockHmrSocket.OPEN = RealWebSocket.OPEN;
            MockHmrSocket.CLOSING = RealWebSocket.CLOSING;
            MockHmrSocket.CLOSED = RealWebSocket.CLOSED;
            window.WebSocket = MockHmrSocket;
          }

          // 2. Suppress Vite HMR logs and errors from console
          var isViteLog = function(args) {
            if (!args || !args.length) return false;
            try {
              for (var i = 0; i < args.length; i++) {
                var str = '';
                var a = args[i];
                if (typeof a === 'string') {
                  str = a;
                } else if (a && typeof a === 'object') {
                  str = (a.message || '') + ' ' + (a.stack || '') + ' ' + (a.reason || '') + ' ' + (typeof a.toString === 'function' ? a.toString() : '');
                } else {
                  str = String(a);
                }
                if (
                  str.indexOf('[vite]') !== -1 ||
                  str.indexOf('vite-hmr') !== -1 ||
                  str.indexOf('[hmr]') !== -1 ||
                  str.indexOf('/@vite/client') !== -1 ||
                  str.indexOf('WebSocket closed without opened') !== -1 ||
                  str.indexOf('polling for restart') !== -1
                ) {
                  return true;
                }
              }
            } catch (e) {}
            return false;
          };
          ['error', 'warn', 'log', 'info', 'debug', 'trace'].forEach(function(m) {
            var orig = console[m];
            if (orig) {
              console[m] = function() {
                if (isViteLog(arguments)) return;
                return orig.apply(console, arguments);
              };
            }
          });
          window.addEventListener('error', function(e) {
            var msg = e ? (e.message || (e.error && e.error.message) || '') : '';
            var str = String(msg);
            if (
              str.indexOf('[vite]') !== -1 ||
              str.indexOf('vite-hmr') !== -1 ||
              str.indexOf('/@vite/client') !== -1 ||
              str.indexOf('WebSocket closed without opened') !== -1 ||
              str.indexOf('polling for restart') !== -1
            ) {
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
              if (e.stopPropagation) e.stopPropagation();
              if (e.preventDefault) e.preventDefault();
              return true;
            }
          }, true);
          window.addEventListener('unhandledrejection', function(e) {
            var reason = e ? (e.reason || e.message || '') : '';
            var str = typeof reason === 'object' ? (reason.message || '') + ' ' + (reason.stack || '') : String(reason);
            if (
              str.indexOf('[vite]') !== -1 ||
              str.indexOf('vite-hmr') !== -1 ||
              str.indexOf('/@vite/client') !== -1 ||
              str.indexOf('WebSocket closed without opened') !== -1 ||
              str.indexOf('polling for restart') !== -1
            ) {
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
              if (e.stopPropagation) e.stopPropagation();
              if (e.preventDefault) e.preventDefault();
              return true;
            }
          }, true);
        } catch (e) {}
      })();
    </script>
